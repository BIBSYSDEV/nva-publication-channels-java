plugins {
    id 'nva.java-conventions'
}

nva {
    errorprone {
        allErrorsAsWarnings = false
    }
    java {
        languageVersion = 25
    }
    pmd {
        analyzeTests = false
        excludedRules = [
                'AvoidCatchingGenericException', // FIXME: NP-48927
                'AvoidFieldNameMatchingMethodName',
                'AvoidThrowingRawExceptionTypes',
                'ClassNamingConventions',
                'ConfusingTernary',
                'CyclomaticComplexity',
                'FieldNamingConventions',
                'GuardLogStatement',
                'SystemPrintln',
                'VariableCanBeInlined'
        ]
    }
}

dependencies {
    testRuntimeOnly(nvaCatalog.junit.jupiter.engine)
    testRuntimeOnly(nvaCatalog.junit.platform.launcher)
}
